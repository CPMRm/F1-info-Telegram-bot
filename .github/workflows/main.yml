name: Run F1 Telegram Bot

on:
  schedule:
    - cron: '0 0 * * *'  # 保持原本的每天自動定時推播
  workflow_dispatch:      # 支援 GitHub 網頁手動觸發
  repository_dispatch:    # 🔥 新增：支援 Telegram 按鈕/Webhook 觸發
    types: [telegram_command]

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 讀取 Telegram 觸發時傳遞的指令類別
          ACTION_TYPE: ${{ github.event.client_payload.action }}
        run: python bot.py
