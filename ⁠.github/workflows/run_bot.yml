name: Run F1 Telegram Bot

on:
  schedule:
    # 每日 UTC 00:00 (台灣時間上午 08:00) 自動執行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上按鈕手動觸發執行

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行機器人腳本
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
